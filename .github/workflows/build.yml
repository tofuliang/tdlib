name: Build 64bit Docker Image
on:
  workflow_dispatch:
    inputs:
      commit:
        default: ''
        description: 'tdlib commit'
  schedule:
    - cron: 0 0 * * *

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id
    permissions:
      packages: write
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit_id: ${{ steps.check.outputs.commit_id }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@master

      - name: Check tdlib updated
        id: check
        run: |
          commit=$(curl -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/tdlib/td/commits?per_page=1&path=CMakeLists.txt")
          currentTimestamp=$(date +%s)
          commitTimestamp=$(date -d $(echo "$commit" | jq -r '.[0].commit.committer.date') +%s)
          difference=$((currentTimestamp - commitTimestamp))

          if [ $difference -lt 90000 ]; then
            commitMessage=$(echo "$commit" | jq -r '.[0].commit.message')
            commitId=$(echo "$commit" | jq -r '.[0].sha')
            version=$(echo "$commitMessage" | grep -ioE "Version (to)? [0-9\.]+" | grep -oE "[0-9\.]+[0-9]+")

            echo "commit_id=$commitId" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"

            echo "$version" > current_version
            git config user.email "tofuliang@gmail.com"
            git config user.name "tofuliang"
            git add current_version
            if ! git diff --cached --quiet; then
              git commit -m "update tdlib to ${version}"
              git push
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.commit }}" != "" ]; then
              commitId="${{ github.event.inputs.commit }}"
            else
              commitId=$(echo "$commit" | jq -r '.[0].sha')
            fi

            commitMessage=$(echo "$commit" | jq -r '.[0].commit.message')
            version=$(echo "$commitMessage" | grep -ioE "Version (to)? [0-9\.]+" | grep -oE "[0-9\.]+[0-9]+")

            if [ -z "$version" ]; then
              version="$commitId"
            fi

            echo "commit_id=$commitId" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "commit_id=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-multiarch:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: alpine
          build-args: |
            TD_COMMIT=${{ needs.prepare.outputs.commit_id }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine-${{ matrix.arch }}
            tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine-${{ matrix.arch }}
            tofuliang/tdlib:latest-${{ matrix.arch }}
            ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine-${{ matrix.arch }}
            ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine-${{ matrix.arch }}
            ghcr.io/tofuliang/tdlib:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

  publish-multiarch:
    name: Publish multi-arch image
    needs: [prepare, build-multiarch]
    if: needs.prepare.outputs.version != '' && needs.build-multiarch.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker Hub manifest
        run: |
          docker buildx imagetools create \
            -t tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine \
            tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine-amd64 \
            tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine-arm64

          docker buildx imagetools create \
            -t tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine \
            tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine-amd64 \
            tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine-arm64

          docker buildx imagetools create \
            -t tofuliang/tdlib:latest \
            tofuliang/tdlib:latest-amd64 \
            tofuliang/tdlib:latest-arm64

      - name: Publish GHCR manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine \
            ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine-amd64 \
            ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.version }}-alpine-arm64

          docker buildx imagetools create \
            -t ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine \
            ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine-amd64 \
            ghcr.io/tofuliang/tdlib:${{ needs.prepare.outputs.commit_id }}-alpine-arm64

          docker buildx imagetools create \
            -t ghcr.io/tofuliang/tdlib:latest \
            ghcr.io/tofuliang/tdlib:latest-amd64 \
            ghcr.io/tofuliang/tdlib:latest-arm64
