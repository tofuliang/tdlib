                --cache-to type=gha,mode=max,scope=build-release-32-386 \
                --tag "tofuliang/tdlib:${VERSION}-alpine-386" \
                --tag "tofuliang/tdlib:${COMMIT_ID}-alpine-386" \
                --tag "tofuliang/tdlib:32bit-latest" \
                --tag "ghcr.io/tofuliang/tdlib:${VERSION}-alpine-386" \
                --tag "ghcr.io/tofuliang/tdlib:${COMMIT_ID}-alpine-386" \
                --tag "ghcr.io/tofuliang/tdlib:32bit-latest" \
