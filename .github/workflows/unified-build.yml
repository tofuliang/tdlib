name: Unified Docker Image Build
on:
  workflow_dispatch:
    inputs:
      commit:
        default: ''
        description: tdlib commit
      version:
        default: ''
        description: tdlib version tag override
      publish_debug_only:
        default: 'false'
        description: publish debug manifests from existing architecture tags
      resume_round:
        default: '0'
        description: handoff round
      resume_targets:
        default: all
        description: comma-separated target families to resume
      resume_state_ref:
        default: ''
        description: artifact reference for previous state
  schedule:
    - cron: '0 0 * * *'

jobs:
  prepare:
    name: Prepare unified build metadata
    runs-on: ubuntu-22.04
    outputs:
      commit_id: ${{ steps.prepare.outputs.commit_id }}
      version: ${{ steps.prepare.outputs.version }}
      resume_round: ${{ steps.prepare.outputs.resume_round }}
      resume_targets: ${{ steps.prepare.outputs.resume_targets }}
      resume_state_ref: ${{ steps.prepare.outputs.resume_state_ref }}
    steps:
      - uses: actions/checkout@master
      - id: prepare
        run: |
          commit=$(curl -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/tdlib/td/commits?per_page=1&path=CMakeLists.txt")
          commitMessage=$(echo "$commit" | jq -r '.[0].commit.message')
          latestCommitId=$(echo "$commit" | jq -r '.[0].sha')
          version=$(echo "$commitMessage" | grep -ioE "Version (to)? [0-9\.]+" | grep -oE "[0-9\.]+[0-9]+")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.commit }}" ]; then
            commitId="${{ github.event.inputs.commit }}"
          else
            commitId="$latestCommitId"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          fi

          if [ -z "$version" ]; then
            version="$commitId"
          fi

          echo "commit_id=$commitId" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resume_round=${{ github.event.inputs.resume_round || '0' }}" >> "$GITHUB_OUTPUT"
          echo "resume_targets=${{ github.event.inputs.resume_targets || 'all' }}" >> "$GITHUB_OUTPUT"
          echo "resume_state_ref=${{ github.event.inputs.resume_state_ref }}" >> "$GITHUB_OUTPUT"

  build-release-64:
    needs: prepare
    if: ${{ github.event.inputs.publish_debug_only != 'true' && (needs.prepare.outputs.resume_round == '0' || contains(needs.prepare.outputs.resume_targets, 'all') || contains(needs.prepare.outputs.resume_targets, 'release-64')) }}
    runs-on: ubuntu-22.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@master
      - name: Restore prior family state
        if: ${{ needs.prepare.outputs.resume_round != '0' && needs.prepare.outputs.resume_state_ref != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: unified-ci-state-build-release-64
          run-id: ${{ needs.prepare.outputs.resume_state_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: restored-state
          merge-multiple: true
      - name: Prepare release 64-bit build tooling
        uses: docker/setup-qemu-action@v3
      - name: Prepare release 64-bit builder
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release 64-bit family
        timeout-minutes: 330
        continue-on-error: true
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_ID: ${{ needs.prepare.outputs.commit_id }}
          RESUME_ROUND: ${{ needs.prepare.outputs.resume_round }}
          RESUME_STATE_REF: ${{ needs.prepare.outputs.resume_state_ref }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          set -euo pipefail

          mkdir -p state
          state_file="state/release_64.json"

          status="running"
          last_completed_stage="release-64-source"
          if [[ "${RUN_STARTED_AT:-}" =~ ^[0-9]+$ ]]; then
            RUN_STARTED_EPOCH="$RUN_STARTED_AT"
          else
            RUN_STARTED_EPOCH=$(date -d "${RUN_STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" +%s)
          fi
          remaining_stages='["release-64-amd64", "release-64-arm64"]'
          needs_handoff=false
          failure_reason=""
          declare -a family_tags=()

          write_state() {
            local state_value="$1"
            local last_stage="$2"
            local remaining="$3"
            local handoff_needed="$4"
            local tags_json
            tags_json="$(printf '%s\n' "${family_tags[@]}" | jq -R -s -c 'split("\n")[:-1]')"
            jq -n \
              --arg status "$state_value" \
              --arg last_completed_stage "$last_stage" \
              --argjson remaining_stages "$remaining" \
              --arg failure_reason "$failure_reason" \
              --argjson needs_handoff "$handoff_needed" \
              --argjson tags "$tags_json" \
              '{
                enabled: true,
                status: $status,
                last_completed_stage: $last_completed_stage,
                remaining_stages: $remaining_stages,
                needs_handoff: $needs_handoff,
                failure_reason: $failure_reason,
                artifacts: {tags: $tags}
              }' > "$state_file"
          }

          append_tag() {
            family_tags+=("$1")
          }

          check_timed_handoff() {
            local last_stage="$1"
            local next_remaining="$2"
            local now
            local elapsed
            local remaining_seconds

            now=$(date +%s)
            elapsed=$((now - RUN_STARTED_EPOCH))
            remaining_seconds=$((6 * 60 * 60 - elapsed))

            if [ "$remaining_seconds" -lt $((20 * 60)) ]; then
              status="handoff"
              needs_handoff=true
              write_state "$status" "$last_stage" "$next_remaining" "$needs_handoff"
              exit 0
            fi
          }

          if [ "$RESUME_ROUND" != "0" ] && [ -n "$RESUME_STATE_REF" ]; then
            if [ -f restored-state/state/release_64.json ]; then
              cp restored-state/state/release_64.json "$state_file"
            elif [ -f restored-state/release_64.json ]; then
              cp restored-state/release_64.json "$state_file"
            fi
          fi

          if [ -f "$state_file" ]; then
            status=$(jq -r '.status // "running"' "$state_file")
            if [ "$status" = "done" ]; then
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              exit 1
            fi
            if [ "$status" = "handoff" ]; then
              status="running"
              needs_handoff=false
            fi
            last_completed_stage=$(jq -r '.last_completed_stage // "release-64-source"' "$state_file")
            remaining_stages=$(jq -c '.remaining_stages // ["release-64-amd64", "release-64-arm64"]' "$state_file")
            mapfile -t family_tags < <(jq -r '.artifacts.tags[]?' "$state_file")
          fi

          if [ "${status}" = "running" ]; then
            write_state "$status" "$last_completed_stage" "$remaining_stages" "$needs_handoff"

            if jq -e --arg stage "release-64-amd64" 'index($stage) != null' <<< "$remaining_stages" > /dev/null; then
              check_timed_handoff "$last_completed_stage" "$remaining_stages"

              if docker buildx build \
                --platform linux/amd64 \
                --file ./alpine/Dockerfile \
                --build-arg TD_COMMIT="$COMMIT_ID" \
                --push \
                --cache-from type=gha,scope=build-release-64-amd64 \
                --cache-to type=gha,mode=max,scope=build-release-64-amd64 \
                --tag "tofuliang/tdlib:${VERSION}-alpine-amd64" \
                --tag "tofuliang/tdlib:${COMMIT_ID}-alpine-amd64" \
                --tag "tofuliang/tdlib:latest-amd64" \
                --tag "ghcr.io/tofuliang/tdlib:${VERSION}-alpine-amd64" \
                --tag "ghcr.io/tofuliang/tdlib:${COMMIT_ID}-alpine-amd64" \
                --tag "ghcr.io/tofuliang/tdlib:latest-amd64" \
                ./alpine; then
                append_tag "tofuliang/tdlib:${VERSION}-alpine-amd64"
                append_tag "tofuliang/tdlib:${COMMIT_ID}-alpine-amd64"
                append_tag "tofuliang/tdlib:latest-amd64"
                append_tag "ghcr.io/tofuliang/tdlib:${VERSION}-alpine-amd64"
                append_tag "ghcr.io/tofuliang/tdlib:${COMMIT_ID}-alpine-amd64"
                append_tag "ghcr.io/tofuliang/tdlib:latest-amd64"
                remaining_stages='["release-64-arm64"]'
                last_completed_stage="release-64-amd64"
                status="running"
                needs_handoff=false
                write_state "$status" "$last_completed_stage" "$remaining_stages" "$needs_handoff"
              else
                status="failed"
                failure_reason="release-64-amd64 build failure"
                write_state "$status" "release-64-amd64" '["release-64-arm64"]' false
                exit 1
              fi
            fi

            if jq -e --arg stage "release-64-arm64" 'index($stage) != null' <<< "$remaining_stages" > /dev/null; then
              check_timed_handoff "$last_completed_stage" "$remaining_stages"

              if docker buildx build \
                --platform linux/arm64 \
                --file ./alpine/Dockerfile \
                --build-arg TD_COMMIT="$COMMIT_ID" \
                --push \
                --cache-from type=gha,scope=build-release-64-arm64 \
                --cache-to type=gha,mode=max,scope=build-release-64-arm64 \
                --tag "tofuliang/tdlib:${VERSION}-alpine-arm64" \
                --tag "tofuliang/tdlib:${COMMIT_ID}-alpine-arm64" \
                --tag "tofuliang/tdlib:latest-arm64" \
                --tag "ghcr.io/tofuliang/tdlib:${VERSION}-alpine-arm64" \
                --tag "ghcr.io/tofuliang/tdlib:${COMMIT_ID}-alpine-arm64" \
                --tag "ghcr.io/tofuliang/tdlib:latest-arm64" \
                ./alpine; then
                append_tag "tofuliang/tdlib:${VERSION}-alpine-arm64"
                append_tag "tofuliang/tdlib:${COMMIT_ID}-alpine-arm64"
                append_tag "tofuliang/tdlib:latest-arm64"
                append_tag "ghcr.io/tofuliang/tdlib:${VERSION}-alpine-arm64"
                append_tag "ghcr.io/tofuliang/tdlib:${COMMIT_ID}-alpine-arm64"
                append_tag "ghcr.io/tofuliang/tdlib:latest-arm64"
                status="done"
                last_completed_stage="release-64-done"
                remaining_stages='[]'
                needs_handoff=false
                failure_reason=""
                write_state "$status" "$last_completed_stage" "$remaining_stages" "$needs_handoff"
              else
                status="failed"
                failure_reason="release-64-arm64 build failure"
                write_state "$status" "release-64-arm64" '[]' false
                exit 1
              fi
            fi
          fi
      - name: Upload family state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unified-ci-state-build-release-64
          path: state/

  build-release-32:
    needs: prepare
    if: ${{ github.event.inputs.publish_debug_only != 'true' && (needs.prepare.outputs.resume_round == '0' || contains(needs.prepare.outputs.resume_targets, 'all') || contains(needs.prepare.outputs.resume_targets, 'release-32')) }}
    runs-on: ubuntu-22.04
    permissions:
      packages: write
